{{ define "main" }}
<h1>My Publications</h1>
<p><strong>Note:</strong> Publications are pulled from ORCID. See <strong><a href="/posts/202411-hugoorcid/" target="_blank">this blog post</a></strong> for details.</p>
</br>
<div id="publications">Loading...</div>
<script>
  const orcid = "{{ .Params.orcid }}"
  fetch(`https://pub.orcid.org/v3.0/${orcid}/works`, {
    headers: { Accept: "application/json" },
  })
    .then((response) => {
      if (!response.ok) {
        throw new Error(`ORCID API returned HTTP ${response.status}`)
      }
      return response.json()
    })
    .then((data) => {
      const publications = data.group
        .map((work) => {
          const summary =
            work && work["work-summary"] && work["work-summary"][0]
              ? work["work-summary"][0]
              : {}
          const title =
            (summary &&
              summary.title &&
              summary.title.title &&
              summary.title.title.value) ||
            "Untitled"
          const journalTitle =
            (summary && summary["journal-title"] && summary["journal-title"].value) ||
            " "
          const externalUrl =
            (summary && summary.url && summary.url.value) || null
          const publicationYear =
            (summary &&
              summary["publication-date"] &&
              summary["publication-date"]["year"] &&
              summary["publication-date"]["year"].value) ||
            " "
          const link =
            externalUrl && externalUrl !== "#"
              ? `<a href="${externalUrl}" target="_blank" rel="noopener"><strong>${title}</strong></a>`
              : `<strong>${title}</strong>`
          return `
          <li>
            ${link}<br>
            <i>${publicationYear}${
            journalTitle != " " ? ", " : ""
          }${journalTitle}</i>
          </li>
        `
        })
        .join("")
      document.getElementById(
        "publications"
      ).innerHTML = `<ul>${publications}</ul>`
    })
    .catch((error) => {
      console.error("Failed to load publications:", error)
      document.getElementById("publications").textContent =
        "Failed to load publications."
    })
</script>
{{ end }}
